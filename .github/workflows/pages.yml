name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check every explainer is listed on the home page
        run: |
          missing=0
          for page in */index.html; do
            dir="${page%/index.html}"
            case "$dir" in _*) continue ;; esac
            if ! grep -q "href=\"$dir/\"" index.html; then
              echo "::error file=index.html::$dir/ is not linked from the home page"
              missing=1
            fi
            [ -f "$dir/thumb.svg" ] || echo "::warning file=$dir/index.html::$dir/ has no thumb.svg"
          done
          exit $missing
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
